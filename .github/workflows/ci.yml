name: Repository checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    name: System One schema and generated types
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
      - name: Install pinned pnpm and dependencies
        run: |
          npm install --global pnpm@11.24.0
          pnpm install --frozen-lockfile
      - name: Validate schema, generated drift, and TypeScript
        run: |
          pnpm run schema:test
          pnpm run contracts:check
          pnpm run types:check
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - name: Resolve and analyze Dart workspace
        run: |
          flutter pub get --enforce-lockfile
          dart pub workspace list
          dart format --output=none --set-exit-if-changed packages/edge_one packages/edge_one_flutter/lib
          dart run tools/check_dart_contract.dart
          dart analyze packages/edge_one
          flutter analyze packages/edge_one_flutter
      - name: Test pure Dart contract and Decision API
        working-directory: packages/edge_one
        run: dart test
      - name: Test verified model download state machine
        working-directory: packages/edge_one_flutter
        run: dart test test/model_store_test.dart
      - name: Test pinned model manifest and legal assets
        working-directory: packages/edge_one_flutter
        run: |
          dart test test/model_manifest_test.dart
          flutter test test/pinned_model_flutter_test.dart
      - name: Verify package assets from a Flutter host
        working-directory: packages/edge_one_flutter/example/asset_host
        run: |
          flutter pub get --enforce-lockfile
          flutter test test/package_assets_test.dart

  native-core:
    name: Native C API and renderer (no model)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure pinned source and build the native library
        run: |
          cmake -S packages/edge_one_core -B "$RUNNER_TEMP/edge-one-core" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/edge-one-core" --parallel 2
      - name: Test validation, rendering, lifecycle, memory, and C ABI
        run: ctest --test-dir "$RUNNER_TEMP/edge-one-core" --output-on-failure

  desktop-evidence:
    name: Unit tests and archived measurements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s spikes/m0/tests -v
      - name: Validate archived measurements
        run: python spikes/m0/check_report.py docs/notes/2026-09-27-m0-desktop.json

  linux-native:
    name: Linux native build and parity
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spikes/m0/requirements.lock
      - name: Prove missing-tool error
        shell: bash
        run: |
          if output=$(PATH=/nonexistent /bin/bash setup.sh 2>&1); then
            echo 'setup.sh unexpectedly passed without tools' >&2
            exit 1
          fi
          [[ $output == *'missing python3.12'* ]]
      - name: Set up twice to check repeatability
        run: |
          bash setup.sh
          bash setup.sh
      - name: Fetch and verify pinned inputs
        run: .cache/m0/.venv/bin/python spikes/m0/setup.py fetch
      - name: Build Linux scorer
        run: .cache/m0/.venv/bin/python spikes/m0/setup.py build --jobs 2
      - name: Check native probability parity
        run: .cache/m0/.venv/bin/python spikes/m0/run.py --output .cache/m0/linux-ci.json --repetitions 1 --threads 2 --required-parity exact
      - name: Upload compact Linux evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-linux-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            .cache/m0/build-receipt.json
            .cache/m0/bin/jev-score
            .cache/m0/llama.cpp-*/build/bin/*.so*
            .cache/m0/linux-ci.json
            .cache/m0/linux-ci.json.partial

  apple-build:
    name: Unsigned iOS and simulator builds
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: spikes/m0/requirements.lock
      - name: Install pinned Python dependencies and XcodeGen
        run: |
          python3 -m venv .cache/m0/.venv
          .cache/m0/.venv/bin/python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r spikes/m0/requirements.lock
          if ! command -v xcodegen >/dev/null 2>&1; then brew install xcodegen; fi
          xcodegen --version
          xcodebuild -version
      - name: Fetch and verify pinned inputs
        run: .cache/m0/.venv/bin/python spikes/m0/setup.py fetch
      - name: Build native scorer and prepare iOS fixture
        run: |
          .cache/m0/.venv/bin/python spikes/m0/setup.py build --jobs 2
          .cache/m0/.venv/bin/python spikes/m0/ios/prepare.py
      - name: Build unsigned iPhone app
        run: .cache/m0/.venv/bin/python spikes/m0/ios/build.py --sdk iphoneos --jobs 2
      - name: Build unsigned simulator app
        run: .cache/m0/.venv/bin/python spikes/m0/ios/build.py --sdk iphonesimulator --jobs 2
      - name: Upload compact Apple build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m0-apple-${{ github.sha }}
          retention-days: 3
          if-no-files-found: ignore
          path: |
            .cache/m0/ios/iphoneos/build-receipt.json
            .cache/m0/ios/iphonesimulator/build-receipt.json
            .cache/m0/ios/iphoneos/DerivedData/Build/Products/Release-iphoneos/EdgeOneM0.app/EdgeOneM0
            .cache/m0/ios/iphonesimulator/DerivedData/Build/Products/Release-iphonesimulator/EdgeOneM0.app/EdgeOneM0
