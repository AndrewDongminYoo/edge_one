name: M0 checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  desktop-evidence:
    name: Unit tests and archived measurements
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s spikes/m0/tests -v
      - name: Validate archived measurements
        run: python spikes/m0/check_report.py docs/notes/2026-09-27-m0-desktop.json
